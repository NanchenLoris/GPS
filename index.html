<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>Dead Reckoning</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="hud">
    <div id="status">Enable sensors to begin</div>
    <div id="readouts">
      <div><b>steps</b><span id="rSteps">0</span></div>
      <div><b>distance</b><span id="rDist">0 m</span></div>
      <div><b>heading</b><span id="rHeading">–</span></div>
      <div><b>accuracy</b><span id="rSigma">–</span></div>
    </div>
  </div>

  <div id="controls">
    <button id="btnEnable">Enable sensors</button>
    <button id="btnStart" disabled>Set start</button>
    <button id="btnTrack" disabled>Start</button>
    <button id="btnReset" class="ghost" disabled>Reset</button>
  </div>

  <p id="hint">Keep this screen on and the app open — tracking stops when it is closed or in the background.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
